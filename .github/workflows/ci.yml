name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/matplotlib
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project (runtime + dev tools)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: CLI init smoke
        run: |
          fieldbird-sim --version
          fieldbird-sim init /tmp/fieldbird-ci-smoke

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: python -m pytest --cov=fieldbird_sim --cov-report=term-missing:skip-covered -q

  package-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/fieldbird-wheel-env
          /tmp/fieldbird-wheel-env/bin/python -m pip install --upgrade pip
          /tmp/fieldbird-wheel-env/bin/python -m pip install dist/*.whl

      - name: Run installed starter project outside checkout
        env:
          MPLBACKEND: Agg
          MPLCONFIGDIR: /tmp/matplotlib-wheel
        run: |
          /tmp/fieldbird-wheel-env/bin/fieldbird-sim init /tmp/fieldbird-wheel-smoke
          cd /tmp/fieldbird-wheel-smoke
          /tmp/fieldbird-wheel-env/bin/fieldbird-sim run --config run.yml

  windows-smoke:
    runs-on: windows-latest
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: ${{ runner.temp }}/matplotlib

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run installed starter project outside checkout
        shell: pwsh
        run: |
          $project = Join-Path $env:RUNNER_TEMP "fieldbird-windows-smoke"
          fieldbird-sim --version
          fieldbird-sim init $project
          Push-Location $project
          try {
            fieldbird-sim run --config run.yml
          } finally {
            Pop-Location
          }
