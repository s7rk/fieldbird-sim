name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/matplotlib
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project (runtime + dev tools)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: CLI init smoke
        run: |
          fieldbird-sim --version
          fieldbird-sim init /tmp/fieldbird-ci-smoke

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: python -m pytest --cov=fieldbird_sim --cov-report=term-missing:skip-covered -q

  package-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/fieldbird-wheel-env
          /tmp/fieldbird-wheel-env/bin/python -m pip install --upgrade pip
          /tmp/fieldbird-wheel-env/bin/python -m pip install dist/*.whl

      - name: Run installed starter project outside checkout
        env:
          MPLBACKEND: Agg
          MPLCONFIGDIR: /tmp/matplotlib-wheel
        run: |
          /tmp/fieldbird-wheel-env/bin/fieldbird-sim init /tmp/fieldbird-wheel-smoke
          cd /tmp/fieldbird-wheel-smoke
          /tmp/fieldbird-wheel-env/bin/fieldbird-sim run --config run.yml

  windows-smoke:
    runs-on: windows-latest
    env:
      MPLBACKEND: Agg

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run installed starter project outside checkout
        shell: pwsh
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: |
          $project = Join-Path $env:RUNNER_TEMP "fieldbird-windows-smoke"
          fieldbird-sim --version
          fieldbird-sim init $project
          Push-Location $project
          try {
            fieldbird-sim run --config run.yml
          } finally {
            Pop-Location
          }

  macos-smoke:
    runs-on: macos-latest
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/matplotlib

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run installed starter project outside checkout
        run: |
          project="$RUNNER_TEMP/fieldbird-macos-smoke"
          fieldbird-sim --version
          fieldbird-sim init "$project"
          cd "$project"
          fieldbird-sim run --config run.yml
