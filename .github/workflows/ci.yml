name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/matplotlib
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project (runtime + dev tools)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest ruff

      - name: CLI run smoke (runtime contract)
        run: |
          cat > /tmp/ci_run_smoke.yml <<'YAML'
          run:
            use_synthetic: true
            n_fields: 10
            n_years: 1
            year_to_show: 1
            day_to_show: 160
            species: ["Feldlerche"]

          plots:
            do_maps: false
            do_heatmaps: false

          scenarios:
            A:
              enabled: false
            B:
              enabled: false
            C:
              enabled: false
            D:
              enabled: false
          YAML
          fieldbird-sim run --config /tmp/ci_run_smoke.yml

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: python -m pytest -q
