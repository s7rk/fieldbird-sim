[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldbird-sim"
version = "0.1.0"
description = "Field bird population simulation (modular port of legacy script)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "pyyaml",
  "shapely",
  "geopandas",
  "pyproj",
  "pyogrio",
  "matplotlib",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]
# Backward-compatible aliases (runtime deps are already part of base install)
geo = [
  "shapely",
  "geopandas",
  "pyproj",
  "pyogrio",
]
viz = [
  "matplotlib",
]
io = [
  "pyarrow",
]

[project.scripts]
fieldbird-sim = "fieldbird_sim.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
  "legacy_sim",
  "src/fieldbird_sim/legacy",
]
