[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldbird-sim"
version = "0.1.0"
description = "Field bird population simulation (modular port of legacy script)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  {name = "fieldbird-sim contributors"},
]
keywords = ["ecology", "simulation", "field birds", "population modelling"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "shapely>=2.0",
  "geopandas>=0.14",
  "pyproj>=3.6",
  "pyogrio>=0.7",
  "matplotlib>=3.7",
]

[project.urls]
Repository = "https://github.com/s7rk/fieldbird-sim"
Issues = "https://github.com/s7rk/fieldbird-sim/issues"

[project.optional-dependencies]
dev = [
  "build",
  "pre-commit",
  "pytest",
  "pytest-cov",
  "ruff",
]
# Backward-compatible aliases (runtime deps are already part of base install)
geo = [
  "shapely",
  "geopandas",
  "pyproj",
  "pyogrio",
]
viz = [
  "matplotlib",
]
io = [
  "pyarrow",
]

[project.scripts]
fieldbird-sim = "fieldbird_sim.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fieldbird_sim = [
  "data/configs/*.csv",
  "data/species/*.csv",
  "data/templates/*.yml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["fieldbird_sim"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 50

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
  "legacy_sim",
]

[tool.ruff.lint.per-file-ignores]
# The maintained legacy package still relies on star-imported shared state and
# compact one-line statements. Keep those known structural debts explicit while
# allowing Ruff to catch every other error in the active simulation core.
"src/fieldbird_sim/legacy/*.py" = ["E701", "E702", "F405"]
