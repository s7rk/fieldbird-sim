run:
  use_synthetic: true
  n_fields: 10
  n_years: 10
  year_to_show: 1
  day_to_show: 160

  species: ["Feldlerche", "Rebhuhn"]
  n_init_first: 100

  outdir_prefix: "outputs"
  run_name: null

plots:
  do_maps: false
  do_heatmaps: false
  draw_flower_rings: true
  draw_hedge_buffers: true
  hedge_buffer_m: 5.0
  maps_years: "year_to_show"
  heatmaps_years: "year_to_show"
  usage_map: true
  heatmap_vmax_mode: "global"

seeds:
  fields: 2025
  rotation: 2025
  management: 2025
  hedges: 2025
  sim: 2025

winter:
  use_year_feedback: true
  winter_survival_adult: 0.95
  winter_survival_juvenile: 0.90
  juvenile_maturation_rate: 0.90
  juvenile_equiv_in_capacity: 0.5
  window_stress_weight: 0.5
  winter_move_radius: 12.0
  winter_beta: 2.5
  winter_distance_cost: 0.08
  winter_eval_days: [330, 20]

capacity:
  use_capacity_soft: true
  k_per_ha_adults: 40.0
  capacity_gamma: 0.4

refuge:
  eligible_crops: ["Winterweizen", "Sommergerste"]
  refuge_assign_mult: 15.0
  pulse_protect_scale: 4.0
  refuge_share_cap: 0.6

synthetic:
  target_row_width_m: null
  cover:
    add_cover: true
    cover_margin_m: 6
    cover_min_patch_m2: 80
    cover_fill_residual: true
    square_pad_m: 8

management:
  use_calendar: true
  calendar_path: "configs/crop_calendar.csv"
  desync_region_sd: 4.0
  desync_field_sd: 3.0
  region_bins: 6

hedges:
  p_edge: 0.7
  from_csv: true

inputs:
  fields_csv: "inputs/fields.csv"
  rotation_csv: "inputs/rotation.csv"
  management_csv: "inputs/management.csv"
  hedges_csv: "inputs/hedges.csv"

scenarios:
  A:
    enabled: false
    shifts: [7, 14, 21]
  B:
    enabled: false
    shares: [0.10, 0.20, 0.30]
    fractions: [0.25, 0.50, 1.00]
    select: "no_flower_first"
    seed: 2025
  C:
    enabled: true
    fallow_area_shares: [0.01, 0.05, 0.10]
    apply_years: "all"
    selection: "best_match"
    seed: 2026
  D:
    enabled: false
    add_skylark_plots: 2
    skylark_plot_area: 0.02
    target_fraction: 0.20
    min_eligible_years: 1
    only_without_flower: true

debug:
  debug_year_xfer: 1

weather_module:
  enabled: false
  weather_csv: "dwd_hoexter_out/hoexter_kl_final_for_birdsim.csv"
  seed: 42
  start_date: null
  missing_date_policy: "raise"

  stress:
    decay: 0.95
    heat_threshold: 28.0
    heat_scale: 10.0
    cold_threshold: 5.0
    cold_scale: 10.0
    wet_threshold: 12.0
    wet_scale: 20.0
    wind_threshold: 12.0
    wind_scale: 10.0
    w_heat: 0.25
    w_cold: 0.20
    w_wet: 0.15
    w_wind: 0.10
    state_clip: 5.0

  food:
    decay: 0.90
    sunshine_threshold_h: 4.0
    sunshine_scale_h: 6.0
    rain_optimal_mm: 4.0
    rain_tolerance_mm: 8.0
    w_sunshine: 0.20
    w_moderate_rain: 0.15
    heat_penalty_weight: 0.45
    wet_penalty_weight: 0.40
    state_clip: 5.0

  habitat:
    decay: 0.94
    wetness_optimal_30d_mm: 90.0
    wetness_tolerance_30d_mm: 80.0
    storm_threshold: 16.0
    storm_scale: 8.0
    w_wet_balance: 0.20
    w_stability: 0.15
    storm_penalty_weight: 0.45
    state_clip: 5.0

  interactions:
    drought_threshold_30d_mm: 50.0
    drought_scale_30d_mm: 35.0
    heat_drought_weight: 0.35
    cold_wet_weight: 0.20
    season_mode: "window"
    breeding_start_doy: 95
    breeding_end_doy: 205
    season_strength: 0.85
    add_to_stress_weight: 0.60
    add_to_food_weight: 0.25
    add_to_habitat_weight: 0.30

  events:
    heatwave:
      enabled: true
      threshold: 32.0
      min_consecutive_days: 3
      effect_duration_days: 4
      trigger_probability: 1.0
      shock_reproduction_mult: 0.80
      shock_juvenile_survival_mult: 0.95
      shock_adult_survival_mult: 0.99
    heavy_rain:
      enabled: true
      threshold: 35.0
      min_consecutive_days: 1
      effect_duration_days: 2
      trigger_probability: 1.0
      shock_reproduction_mult: 0.88
      shock_juvenile_survival_mult: 0.96
      shock_adult_survival_mult: 0.995
    storm:
      enabled: true
      threshold: 22.0
      min_consecutive_days: 1
      effect_duration_days: 3
      trigger_probability: 1.0
      shock_reproduction_mult: 0.85
      shock_juvenile_survival_mult: 0.94
      shock_adult_survival_mult: 0.992
    cold_snap:
      enabled: true
      threshold: -2.0
      min_consecutive_days: 2
      effect_duration_days: 3
      trigger_probability: 1.0
      shock_reproduction_mult: 0.86
      shock_juvenile_survival_mult: 0.95
      shock_adult_survival_mult: 0.993

  factors:
    reproduction:
      intercept: 0.35
      stress_weight: 0.75
      food_weight: 0.25
      habitat_weight: 0.15
      min: 0.90
      max: 1.10
    juvenile_survival:
      intercept: 0.35
      stress_weight: 0.55
      food_weight: 0.12
      habitat_weight: 0.10
      min: 0.97
      max: 1.03
    adult_survival:
      intercept: 0.40
      stress_weight: 0.45
      food_weight: 0.08
      habitat_weight: 0.08
      min: 0.995
      max: 1.005
